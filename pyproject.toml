[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento por mensagens de texto para a Empório da Música (desafio técnico Artefact - AI Engineer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pedro Sydriao", email = "sydriao.01@gmail.com" }]
dependencies = [
    "anthropic>=0.49",
    "openai>=1.65",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: testes que chamam a API do modelo (pulados sem chave configurada)",
]
